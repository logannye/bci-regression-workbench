[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-regression-workbench"
version = "0.1.0"
description = "Reproducible session-level comparisons of existing BCI decoder predictions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Logan Nye"}]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=17"]

[project.urls]
Repository = "https://github.com/logannye/bci-regression-workbench"

[tool.setuptools.packages.find]
where = ["src"]
