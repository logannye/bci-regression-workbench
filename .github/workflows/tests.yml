name: Comparison validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test core without optional packages
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Exercise recurring candidate evaluation and score reproduction
        env:
          PYTHONPATH: src
        run: |
          python examples/basic_comparison.py --output-dir "$RUNNER_TEMP/basic-demo"
          python examples/basic_comparison.py --output-dir "$RUNNER_TEMP/basic-demo" --candidate-id candidate-002
      - name: Build and smoke-test the pure Python wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          python -c "from bci_regression import EvaluationSet, PredictionSet, compare, reproduce; print('Installed package import passed')"

  datarepo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install optional integration from wheels only
        run: |
          python -m pip install --only-binary=:all: -r requirements-datarepo.txt
      - name: Test with real Arrow and Parquet
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run the real datarepo integration
        env:
          PYTHONPATH: src
        run: |
          python examples/datarepo_example.py --output-dir "$RUNNER_TEMP/datarepo-example"
          python -c "from bci_regression import reproduce; reproduce('$RUNNER_TEMP/datarepo-example/comparison'); print('datarepo comparison reproduced')"
          python -m pip freeze > "$RUNNER_TEMP/datarepo-example/environment.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/datarepo-example/revision.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-datarepo-evidence
          path: ${{ runner.temp }}/datarepo-example
          retention-days: 14
          if-no-files-found: warn
